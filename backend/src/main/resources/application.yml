# All environment-specific values are resolved from environment variables
# at startup. Nothing here is baked into the build. See ../.env.example.
spring:
  application:
    name: staffsuite-backend
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT}

staffsuite:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS}
  storage:
    path: ${FILE_STORAGE_PATH}
    type: "${STORAGE_TYPE:local}"
  # Optional: creates the first SYSTEM_ADMIN on startup when the users table is empty.
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  password-reset:
    expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:30}
  documents:
    expiry-window-days: "${DOCUMENT_EXPIRY_WINDOW_DAYS:30}"
  attendance:
    late-cutoff: "${ATTENDANCE_LATE_CUTOFF:09:30}"
    half-day-hours: "${ATTENDANCE_HALF_DAY_HOURS:4}"
    timezone: "${ATTENDANCE_TIMEZONE:Asia/Kolkata}"
    correction-window-days: "${ATTENDANCE_CORRECTION_WINDOW_DAYS:30}"
